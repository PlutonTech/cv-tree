# Render blueprint for the CV Tree server (usage stats, admin dashboard, free hosted AI, privacy policy).
# On render.com: New > Blueprint > pick this repo. Render asks for the values marked sync: false.
#
# This is the $0 setup: Render's free plan and OpenRouter's free models.
#  - The free plan sleeps after 15 minutes without visitors; the next request takes about a minute to wake it.
#  - It has no persistent disk, so the admin stats reset whenever Render restarts the server.
# To keep stats permanently later: change plan to starter and uncomment the disk block (about $7/month),
# and to use Claude instead of free models, set HOSTED_MODEL to anthropic/claude-haiku-5.5 (needs OpenRouter credits).
services:
  - type: web
    name: cvtree-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: "true"
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_TOKEN          # your dashboard password, 12+ characters
        sync: false
      - key: OPENROUTER_API_KEY   # a normal OpenRouter API key (not a management key); turns on the free AI
        sync: false
      - key: PUBLISHER_NAME       # shown on the privacy policy
        sync: false
      - key: CONTACT_EMAIL        # shown on the privacy policy
        sync: false
      - key: HOSTED_MODEL
        value: openrouter/free
      - key: HOSTED_DAILY_LIMIT
        value: "30"
      - key: HOSTED_DAILY_BUDGET_USD
        value: "1"
      - key: INGEST_KEY
        value: cvtree-ingest
    # disk:                       # needs plan: starter
    #   name: cvtree-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add DB_PATH=/var/data/cvtree.db)
